<section class="services section" id="services">
    <h2 class="section__title">
        <span>Skills</span>
        <span class="geometric-box"></span>
    </h2>

    <div class="services__container container grid">
        {%- assign icons = "ri-3d-line,ri-bar-chart-box-line,ri-cpu-line,ri-tools-line" | split: "," -%}
        {%- for category in site.skills -%}
        <article class="services__card">
            <span class="services__icon">
                <i class="{{ icons[forloop.index0] | default: 'ri-tools-line' }}" aria-hidden="true"></i>
            </span>
            <h3 class="services__title">{{ category.category }}</h3>
            <ul class="services__list">
                {%- for tool in category.tools -%}
                <li class="services__list-item">{{ tool }}</li>
                {%- endfor -%}
            </ul>
        </article>
        {%- endfor -%}
    </div>
</section>
