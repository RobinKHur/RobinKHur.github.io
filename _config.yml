# Google Analytics 4 (GA4) Measurement ID, e.g. "G-ABC123DEF4".
# Find it under Admin → Data Streams → Web in your GA4 property.
# Replace the placeholder below with your real id.
# The tag snippet only loads when the site is built with JEKYLL_ENV=production.
# Note: GitHub Pages builds with JEKYLL_ENV=production automatically, so
# deployment will include the snippet. Local `bundle exec jekyll serve`
# defaults to development and will NOT include it (so your own browsing
# during preview won't pollute analytics).
# Set to an empty string to disable tracking.
google_analytics: G-6XJVFQY3MF

name: Robin Hur
description: |
  I'm a mechanical engineering student at UVA (GPA 3.75, expected May 2027)
  pursuing hands-on research across computational fluid dynamics, molecular
  simulations, and closed-loop control systems. My coursework spans statics,
  thermodynamics, fluid mechanics, dynamics, material science, mechatronics,
  and computational methods — a foundation I apply daily in lab.

  I've contributed to projects ranging from bio-inspired underwater robotics
  CFD to NASA- and Lockheed Martin-sponsored aerospace materials testing, and
  I'm a co-author on a pentapeptide self-assembly paper in ACS Biomaterials
  Science & Engineering. I enjoy bridging computation and physical prototyping —
  whether that means running parallel HPC jobs, designing PID controllers, or
  building CAD assemblies for competition robots.

