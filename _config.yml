      - Finite Element Analysis (FEA)
      - Tecplot
      - GD&T (ASME Y14)
      - Lean Six Sigma
  - category: Computational
    tools:
      - Python (NumPy, Matplotlib)
      - Molecular Dynamics (AMBER)
      - Visual Molecular Dynamics (VMD)
      - HPC & Batch Job Management (SLURM)
      - Data Analysis & Visualization

collections:
  projects:
    output: true
    permalink: /projects/:path/

plugins:
  - jekyll-feed

include:
  - _projects

exclude:
  - _site
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
