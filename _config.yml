skills:
  - category: 3D Modeling & Prototyping
    tools:
      - SolidWorks (CSWA)
      - Autodesk Fusion
      - Autodesk Maya
      - OnShape
      - 3D Printing (FDM)
      - Low-Fidelity Rapid Prototyping
  - category: Engineering Analysis & Design
