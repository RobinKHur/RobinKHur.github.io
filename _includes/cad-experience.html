<section class="cad section" id="cad">
    <h2 class="section__title">
        <span>General CAD Experience</span>
        <span class="geometric-box"></span>
    </h2>

    <div class="cad__container container grid">
        {%- for item in site.data.cad-experience -%}
        <button type="button" class="cad__card" data-image="{{ item.image | relative_url }}" data-title="{{ item.title }}" data-description="{{ item.description }}" aria-haspopup="dialog" aria-label="View CAD image: {{ item.title }}">
            <h3 class="cad__title">{{ item.title }}</h3>
            {%- if item.subtitle -%}
            <p class="cad__subtitle">{{ item.subtitle }}</p>
            {%- endif -%}
        </button>
        {%- endfor -%}
    </div>

    <!-- Pop-up image viewer: hidden by default, opened by clicking a card. PDFs (e.g. the SW certificate) are rendered to a plain image with PDF.js so no browser PDF toolbar appears. -->
    <div class="cad__modal" id="cad-modal" role="dialog" aria-modal="true" aria-label="CAD design image" aria-hidden="true">
        <div class="cad__modal-backdrop" data-cad-close></div>
        <div class="cad__modal-content">
            <button type="button" class="cad__modal-close" data-cad-close aria-label="Close image">
                <i class="ri-close-line" aria-hidden="true"></i>
            </button>
            <img class="cad__modal-image" src="" alt="" onerror="this.style.display='none'">
            <a class="cad__modal-link" href="#" target="_blank" rel="noopener noreferrer" hidden>
                <i class="ri-external-link-line" aria-hidden="true"></i> Open PDF
            </a>
            <p class="cad__modal-title"></p>
            <p class="cad__modal-description"></p>
        </div>
    </div>
</section>
